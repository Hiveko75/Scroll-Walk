# Builds the Minecraft 1.21.1 (Fabric) jar on every push to port-1.21.1 (or manually from the Actions tab).
name: Build 1.21.1 (Fabric)

on:
  push:
    branches: [port-1.21.1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: scrollwalk-1.21.1-fabric
          path: build/libs/*.jar
