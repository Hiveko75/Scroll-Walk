# Builds the Minecraft 1.21.1 (Fabric) jar on every push to port-1.21.1 (or manually from the Actions tab).
name: Build 1.21.1 (Fabric)

on:
  push:
    branches: [port-1.21.1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: scrollwalk-1.21.1-fabric
          path: build/libs/*.jar

      # Publishes the jar as a release of this fork, tagged with hiveko_release from
      # gradle.properties, unless that release already exists (change the value to publish again).
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(grep '^hiveko_release=' gradle.properties | cut -d= -f2)
          [ -n "$TAG" ] || exit 0
          if gh release view "$TAG" >/dev/null 2>&1; then echo "release $TAG exists"; exit 0; fi
          JAR=$(ls build/libs/*.jar | grep -v sources)
          gh release create "$TAG" $JAR --target "$GITHUB_SHA" --title "Scroll Walk $TAG" \
            --notes "Unofficial port of [Scroll Walk](https://modrinth.com/mod/scroll-walk) 1.2 by Naw7k (MIT) to Minecraft 1.21 - 1.21.1 (Fabric). While flying, Alt + scroll is left to fly speed mods such as Creative Fly. Requires Fabric API, Cloth Config and Mod Menu."
